<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>On_Synth_App</title>

    <!-- S.1.3 — PWA légère (standalone, installable). Manifest SVG-only :
         apple-touch-icon/maskable PNG en dette (cf. BACKLOG) faute de
         rasteriseur système. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f1a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7" />
    <!-- Standalone iOS = gain principal (barre d'adresse supprimée à l'ajout
         à l'écran d'accueil). apple-touch-icon volontairement omis : iOS ne
         rasterise pas le SVG → icône générique assumée temporairement. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="On_Synth_App" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
