<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="system-ui, sans-serif" role="img" aria-label="Reponses en frequence des quatre types de filtre : passe-bas, passe-haut, passe-bande, coupe-bande">
  <!-- ============ Passe-bas (haut gauche) ============ -->
  <g>
    <rect x="20" y="24" width="220" height="110" fill="none" stroke="#b9bed0" stroke-width="1"/>
    <text x="30" y="20" fill="#6f7689" font-size="12">passe-bas</text>
    <!-- coupure verticale -->
    <line x1="150" y1="24" x2="150" y2="134" stroke="#c98a4a" stroke-width="0.8" stroke-dasharray="3 3"/>
    <!-- courbe : plat puis chute apres la coupure, leger pic de resonance -->
    <path d="M24,60 L120,60 L145,52 L160,74 L200,118 L236,130"
          fill="none" stroke="#5b8def" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ Passe-haut (haut droite) ============ -->
  <g>
    <rect x="280" y="24" width="220" height="110" fill="none" stroke="#b9bed0" stroke-width="1"/>
    <text x="290" y="20" fill="#6f7689" font-size="12">passe-haut</text>
    <line x1="370" y1="24" x2="370" y2="134" stroke="#c98a4a" stroke-width="0.8" stroke-dasharray="3 3"/>
    <path d="M284,130 L340,118 L365,74 L380,52 L405,60 L496,60"
          fill="none" stroke="#5b8def" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ Passe-bande (bas gauche) ============ -->
  <g>
    <rect x="20" y="168" width="220" height="110" fill="none" stroke="#b9bed0" stroke-width="1"/>
    <text x="30" y="164" fill="#6f7689" font-size="12">passe-bande</text>
    <line x1="130" y1="168" x2="130" y2="278" stroke="#c98a4a" stroke-width="0.8" stroke-dasharray="3 3"/>
    <path d="M24,272 L90,258 L120,200 L130,182 L140,200 L170,258 L236,272"
          fill="none" stroke="#5b8def" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ Coupe-bande (bas droite) ============ -->
  <g>
    <rect x="280" y="168" width="220" height="110" fill="none" stroke="#b9bed0" stroke-width="1"/>
    <text x="290" y="164" fill="#6f7689" font-size="12">coupe-bande</text>
    <line x1="390" y1="168" x2="390" y2="278" stroke="#c98a4a" stroke-width="0.8" stroke-dasharray="3 3"/>
    <path d="M284,182 L350,184 L378,220 L390,266 L402,220 L430,184 L496,182"
          fill="none" stroke="#5b8def" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="260" y="296" fill="#8a90a6" font-size="11" text-anchor="middle">axe horizontal : fréquence (log) — pointillé : fréquence de coupure</text>
</svg>
