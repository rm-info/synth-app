<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" font-family="system-ui, sans-serif" role="img" aria-label="Enveloppe AHDSR : les cinq segments attaque, maintien, declin, soutien, relache">
  <!-- Axes -->
  <line x1="40" y1="200" x2="500" y2="200" stroke="#888ea3" stroke-width="1.2"/>
  <line x1="40" y1="200" x2="40" y2="30" stroke="#888ea3" stroke-width="1.2"/>
  <text x="34" y="40" fill="#8a90a6" font-size="12" text-anchor="end">1</text>
  <text x="34" y="204" fill="#8a90a6" font-size="12" text-anchor="end">0</text>
  <text x="26" y="120" fill="#8a90a6" font-size="12" text-anchor="middle" transform="rotate(-90 26 120)">volume</text>
  <text x="270" y="232" fill="#8a90a6" font-size="12" text-anchor="middle">temps</text>

  <!-- Niveau de soutien (repere pointille) -->
  <line x1="40" y1="120" x2="380" y2="120" stroke="#c98a4a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="496" y="118" fill="#c98a4a" font-size="11" text-anchor="end">niveau de Soutien</text>

  <!-- Courbe AHDSR : A (40->120 montee), H (120->180 plateau au pic), D (180->250 descente),
       S (250->380 tenue au niveau soutien), R (380->470 extinction) -->
  <path d="M40,200 L120,40 L180,40 L250,120 L380,120 L470,200"
        fill="none" stroke="#5b8def" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Bornes verticales des segments -->
  <g stroke="#b9bed0" stroke-width="0.8" stroke-dasharray="2 3">
    <line x1="120" y1="40" x2="120" y2="200"/>
    <line x1="180" y1="40" x2="180" y2="200"/>
    <line x1="250" y1="120" x2="250" y2="200"/>
    <line x1="380" y1="120" x2="380" y2="200"/>
  </g>

  <!-- Etiquettes de segments -->
  <g fill="#6f7689" font-size="12" text-anchor="middle">
    <text x="80" y="216">Attaque</text>
    <text x="150" y="216">Maintien</text>
    <text x="215" y="216">Déclin</text>
    <text x="315" y="216">Soutien</text>
    <text x="425" y="216">Relâche</text>
  </g>

  <!-- Marqueur du relachement de touche -->
  <text x="380" y="28" fill="#6f7689" font-size="11" text-anchor="middle">touche relâchée</text>
  <path d="M380,32 L380,116" stroke="#6f7689" stroke-width="0.8" stroke-dasharray="1 3"/>
</svg>
